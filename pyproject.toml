[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "alembic/versions",
  "uploads",
]

[tool.ruff.lint]
# Preserve the pre-0.16 baseline explicitly so future Ruff releases cannot
# silently widen CI's blocking rule set.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
